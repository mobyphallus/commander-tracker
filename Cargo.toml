[package]
name = "commander_pod"
version = "0.1.0"
edition = "2021"
description = "Local MTG Commander pod tracker: life, poison, commander damage, turn timers, and win-rate stats."

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[profile.release]
opt-level = 3
