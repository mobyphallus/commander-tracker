[package]
name = "commander_pod"
version = "0.1.0"
edition = "2021"
default-run = "commander_pod"
description = "Local MTG Commander pod tracker: life, poison, commander damage, turn timers, and win-rate stats."

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "lazy", "advanced", "canvas"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
